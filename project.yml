name: RewindCam
options:
  bundleIdPrefix: io.github.rewindcam
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  fileTypes:
    # Privacy manifest must be copied into the app bundle (Copy Bundle Resources).
    # XcodeGen's default for .xcprivacy has changed between releases, so pin it.
    xcprivacy:
      buildPhase: resources
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  RewindCam:
    type: application
    platform: iOS
    sources:
      - path: RewindCam
    info:
      path: RewindCam/Info.plist
      properties:
        CFBundleDisplayName: RewindCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: RewindCam keeps a short rolling video buffer on this phone so you can save moments that already happened. Nothing leaves your device.
        NSMicrophoneUsageDescription: RewindCam records sound with the video buffer. You can turn audio off in Settings. Nothing leaves your device.
        NSPhotoLibraryAddUsageDescription: RewindCam adds the clips you save to your photo library. It never reads your existing photos.
        NSSpeechRecognitionUsageDescription: When you enable the voice trigger, RewindCam listens on-device for "save that". Audio is never sent anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rewindcam.RewindCam
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  RewindCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RewindCamTests
    dependencies:
      - target: RewindCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rewindcam.RewindCamTests
  RewindCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RewindCamUITests
    dependencies:
      - target: RewindCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RewindCam
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rewindcam.RewindCamUITests
schemes:
  RewindCam:
    build:
      targets:
        RewindCam: all
        RewindCamTests: [test]
        RewindCamUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: RewindCamTests
          parallelizable: false
        - name: RewindCamUITests
          parallelizable: false
    run:
      config: Debug

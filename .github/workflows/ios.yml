name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write is used only by the last step, to publish UI screenshots to the hidden
  # ref refs/ci/screenshots (not a branch) on push events.
  contents: write

jobs:
  test:
    name: Build & test (Simulator)
    # Newest GitHub-hosted macOS image (see actions/runner-images README).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RESULT_BUNDLE: TestResults.xcresult
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Pick and boot simulator
        id: sim
        run: |
          set -euo pipefail
          read -r UDID NAME RUNTIME < <(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Using $NAME ($RUNTIME) $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Test
        # Per-test timeouts: a hung test fails on its own (and is named in the .xcresult)
        # instead of running into the job timeout. Default 180 s is >= 3x the slowest test
        # (UI tests ~16-53 s, the 300 s eviction unit test ~9-30 s); no test may ask for more
        # than 300 s via .timeLimit. Xcode rounds allowances up to whole minutes.
        run: |
          set -o pipefail
          xcodebuild test \
            -project RewindCam.xcodeproj \
            -scheme RewindCam \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Stress unit tests (flake detector)
        # Re-runs the unit tests (not UI tests) a few times on the already-built products,
        # to catch intermittent crashes or timing-dependent failures.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project RewindCam.xcodeproj \
            -scheme RewindCam \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RewindCamTests \
            -test-iterations 4 -run-tests-until-failure \
            -resultBundlePath StressResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee stress.log | { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }

      - name: Export screenshots and summary
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool export attachments --path "$RESULT_BUNDLE" --output-path artifacts/screenshots || true
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > artifacts/summary.json || true
            xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" > artifacts/tests.json || true
          fi
          python3 scripts/summarize-xcresult.py artifacts/summary.json artifacts/tests.json > artifacts/test-summary.md || true
          cat artifacts/test-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat artifacts/test-summary.md || true
          cp xcodebuild.log stress.log artifacts/ 2>/dev/null || true
          # The app's own log (app under UI test and unit-test host) from the simulator.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 30m --style compact \
            --predicate 'process == "RewindCam"' > artifacts/simulator.log 2>&1 || true
          # Crash reports (test host or app): print the crashed thread and keep the .ips files.
          mkdir -p artifacts/crashes
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool export diagnostics --path "$RESULT_BUNDLE" --output-path artifacts/diagnostics >/dev/null 2>&1 || true
          fi
          find artifacts/diagnostics ~/Library/Logs/DiagnosticReports \( -name '*.ips' -o -name '*.crash' \) \
            -newer project.yml 2>/dev/null | grep -i -E 'rewindcam|xctest' | while read -r f; do cp "$f" artifacts/crashes/; done || true
          if ls artifacts/crashes/*.ips >/dev/null 2>&1; then
            python3 scripts/crash-summary.py artifacts/crashes/*.ips | tee artifacts/crashes/summary.txt
          fi
          ls -la artifacts/screenshots | head -50
          ls -la artifacts

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots, logs and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots-and-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots to refs/ci/screenshots
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [ -f artifacts/screenshots/manifest.json ] || { echo "no screenshots"; exit 0; }
          rm -rf ci-screenshots && python3 scripts/rename-screenshots.py artifacts/screenshots ci-screenshots
          cp artifacts/test-summary.md ci-screenshots/ 2>/dev/null || true
          if ls artifacts/crashes/* >/dev/null 2>&1; then mkdir -p ci-screenshots/crashes && cp artifacts/crashes/* ci-screenshots/crashes/; fi
          # One orphan commit, force-pushed: the ref always holds only the latest run.
          export GIT_INDEX_FILE="$RUNNER_TEMP/screenshots.index"
          rm -f "$GIT_INDEX_FILE"
          git add -f ci-screenshots
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "UI screenshots for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})")
          git push -f origin "$COMMIT:refs/ci/screenshots"
